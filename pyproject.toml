[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "living-evidence-graph"
version = "0.1.0"
description = "Living Evidence Graph — Taskmaster scaffold for All Things Agentic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.15.0",
  "google-genai>=1.0.0",
  "google-cloud-firestore>=2.19.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.9.0",
  "pypdf>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["living_evidence_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
